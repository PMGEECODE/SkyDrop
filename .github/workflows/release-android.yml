name: Release SkyDrop Android

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or version to release (e.g. android-v1.0.45 or 1.0.45)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run: build and verify without publishing to public repo'
        required: false
        type: boolean
        default: false

# Restrict default GITHUB_TOKEN permissions
permissions:
  contents: read

env:
  RELEASES_REPO: ${{ vars.RELEASES_REPO || 'PMGEECODE/skydrop-release' }}

jobs:
  build-android-apk:
    name: Build Android Mobile APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Android App Submodule
        env:
          SUBMODULE_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          cd ..
          if [ -d "Android-app/.git" ] || [ -f "Android-app/build.gradle.kts" ]; then
            echo "Android-app workspace already populated."
          else
            echo "Cloning skydrop-app repository..."
            git clone "https://${SUBMODULE_TOKEN}@github.com/PMGEECODE/skydrop-app.git" Android-app
          fi

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Version Consistency
        run: |
          RAW_TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            RAW_TAG="${{ inputs.tag_name }}"
          fi
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="android-v$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          fi

          CLEAN_VERSION=$(echo "$RAW_TAG" | sed -E 's/^(android-)?v//')
          GRADLE_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)

          echo "Target Release version: $CLEAN_VERSION"
          echo "Android-app/app/build.gradle.kts versionName: $GRADLE_VERSION"

          if [ "$CLEAN_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag version ($CLEAN_VERSION) does not match app/build.gradle.kts versionName ($GRADLE_VERSION)!"
            exit 1
          fi

      - name: Run Android Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Setup Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secret..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          elif [ -f "debug.keystore" ]; then
            echo "Using tracked debug.keystore for signing..."
            cp debug.keystore release.keystore
          fi

      - name: Build Android Release APK
        run: ./gradlew :app:assembleRelease

      - name: Stage Android APK and Compute Checksum
        run: |
          mkdir -p staging
          RAW_TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            RAW_TAG="${{ inputs.tag_name }}"
          fi
          CLEAN_VERSION=$(echo "$RAW_TAG" | sed -E 's/^(android-)?v//')
          if [ -z "$CLEAN_VERSION" ]; then
            CLEAN_VERSION="1.0.45"
          fi
          APK_NAME="SkyDrop-android-${CLEAN_VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "staging/${APK_NAME}"
          cd staging
          sha256sum "${APK_NAME}" > sha256sums.txt
          echo "Generated APK: ${APK_NAME}"
          cat sha256sums.txt

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            Android-app/staging/*.apk
            Android-app/staging/sha256sums.txt
          retention-days: 7

  publish-android-release:
    name: Publish Android Release to Public Repository
    needs: [build-android-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create staging directory and download artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: staging

      - name: Publish Release to Public Repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          RAW_TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            RAW_TAG="${{ inputs.tag_name }}"
          fi
          CLEAN_VERSION=$(echo "$RAW_TAG" | sed -E 's/^(android-)?v//')
          if [ -z "$CLEAN_VERSION" ]; then
            CLEAN_VERSION="1.0.45"
          fi
          RELEASE_TAG="android-v${CLEAN_VERSION}"
          RELEASE_TITLE="SkyDrop Android v${CLEAN_VERSION}"

          echo "Target Public Repo: ${RELEASES_REPO}"
          echo "Release Tag: ${RELEASE_TAG}"
          echo "Release Title: ${RELEASE_TITLE}"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run requested - skipping actual release publishing."
            ls -la staging
            exit 0
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASES_REPO_TOKEN secret is not set! Cannot publish to public repo."
            exit 1
          fi

          APK_FILE=$(ls staging/*.apk 2>/dev/null | xargs -n1 basename | head -n1 || echo "SkyDrop-android.apk")

          echo "Generating clean release notes from git commit log for Android..."
          PREV_TAG=$(git tag -l "android-v*" --sort=-v:refname | grep -v "^${RAW_TAG}$" | grep -v "^android-v${CLEAN_VERSION}$" | head -n 1 || true)
          COMMITS=""
          if [ -n "$PREV_TAG" ]; then
            echo "Extracting Android commits since $PREV_TAG..."
            COMMITS=$(git log "${PREV_TAG}..HEAD" --oneline -- Android-app || true)
          fi

          if [ -z "$COMMITS" ]; then
            echo "Extracting recent Android commits..."
            COMMITS=$(git log -n 10 --oneline -- Android-app || true)
          fi

          NOTES_LIST=$(echo "$COMMITS" | sed -E 's/^[a-f0-9]+ //' | grep -vE '^(chore|ci|test|merge)' | sed -E 's/^[a-z]+(\([^\)]+\))?:\s*//' | awk '{print toupper(substr($0,1,1)) substr($0,2)}' | sed 's/^/- /' || true)

          if [ -z "$NOTES_LIST" ]; then
            NOTES_LIST="- Performance optimizations, in-app updater support, and connectivity enhancements."
          fi

          {
            echo "## What's New in SkyDrop Android v${CLEAN_VERSION}"
            echo ""
            echo "$NOTES_LIST"
            echo ""
            echo "### Downloads & Verification"
            echo "- **Android Mobile Package**: \`${APK_FILE}\`"
            echo "- **SHA-256 Checksum**: Check attached \`sha256sums.txt\`"
            echo ""
            echo "### Compatibility"
            echo "- Android 8.0 (API 26) and newer phones & tablets."
          } > release_body.md

          echo "Generated Release Notes:"
          cat release_body.md

          ASSET_ARGS=()
          for asset in staging/*; do
            if [ -f "$asset" ]; then
              ASSET_ARGS+=("$asset")
            fi
          done

          echo "Publishing release to ${RELEASES_REPO}..."
          gh release delete "${RELEASE_TAG}" --repo "${RELEASES_REPO}" --yes || true
          git push --delete "https://${GH_TOKEN}@github.com/${RELEASES_REPO}.git" "${RELEASE_TAG}" || true

          gh release create "${RELEASE_TAG}" \
            "${ASSET_ARGS[@]}" \
            --repo "${RELEASES_REPO}" \
            --title "${RELEASE_TITLE}" \
            --notes-file release_body.md
