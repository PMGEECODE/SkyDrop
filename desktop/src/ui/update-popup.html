<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SkyDrop Update</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: transparent;
      color: #e2e8f0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .popup-container {
      width: 100%;
      height: 100%;
      background: rgba(15, 20, 32, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 180, 216, 0.4);
      border-radius: 14px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 180, 216, 0.2);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      animation: popupSlideIn 250ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popupSlideIn {
      from { transform: translateY(20px) scale(0.96); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .popup-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .popup-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0, 180, 216, 0.4));
    }
    .popup-title-group h4 {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.2px;
    }
    .popup-version-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      background: rgba(0, 180, 216, 0.18);
      color: #38bdf8;
      border: 1px solid rgba(0, 180, 216, 0.35);
      border-radius: 6px;
      font-family: monospace;
      display: inline-block;
      margin-top: 2px;
    }
    .popup-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 150ms ease, color 150ms ease;
    }
    .popup-close:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .popup-body {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
      margin: 4px 0 8px 0;
    }
    .popup-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    .btn {
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      padding: 6px 14px;
      cursor: pointer;
      border: none;
      transition: all 150ms ease;
    }
    .btn-later {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
    }
    .btn-later:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .btn-update {
      background: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(0, 180, 216, 0.3);
    }
    .btn-update:hover {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      box-shadow: 0 4px 14px rgba(0, 180, 216, 0.5);
    }
    .progress-section {
      display: none;
      margin-top: 4px;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00b4d8, #38bdf8);
      transition: width 150ms ease;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="popup-brand">
        <img src="assets/logo.png" alt="SkyDrop" class="popup-logo">
        <div class="popup-title-group">
          <h4>New Update Available</h4>
          <span id="version-badge" class="popup-version-badge">v1.0.0</span>
        </div>
      </div>
      <button id="btn-close" class="popup-close" title="Dismiss">✕</button>
    </div>

    <div id="popup-desc" class="popup-body">
      A new version of SkyDrop is ready to install with improvements and updates.
    </div>

    <div id="progress-section" class="progress-section">
      <div class="progress-info">
        <span id="progress-status">Downloading update...</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
    </div>

    <div id="actions-section" class="popup-actions">
      <button id="btn-later" class="btn btn-later">Later</button>
      <button id="btn-update" class="btn btn-update">Update</button>
    </div>
  </div>

  <script>
    const versionBadge = document.getElementById('version-badge');
    const popupDesc = document.getElementById('popup-desc');
    const btnClose = document.getElementById('btn-close');
    const btnLater = document.getElementById('btn-later');
    const btnUpdate = document.getElementById('btn-update');
    const progressSection = document.getElementById('progress-section');
    const actionsSection = document.getElementById('actions-section');
    const progressFill = document.getElementById('progress-fill');
    const progressPercent = document.getElementById('progress-percent');
    const progressStatus = document.getElementById('progress-status');

    let isDownloading = false;

    if (window.updatePopup) {
      window.updatePopup.onInitUpdateData((data) => {
        if (data && data.latestVersion) {
          versionBadge.textContent = 'v' + data.latestVersion;
        }
        if (data && data.releaseName) {
          popupDesc.textContent = data.releaseName + ' is ready to download and install.';
        }
      });

      window.updatePopup.onDownloadProgress((prog) => {
        if (!prog) return;
        progressSection.style.display = 'block';
        actionsSection.style.display = 'none';
        const pct = Math.min(100, Math.max(0, prog.percent || 0));
        progressFill.style.width = pct + '%';
        progressPercent.textContent = pct + '%';
        if (prog.total > 0) {
          const transMb = (prog.transferred / (1024 * 1024)).toFixed(1);
          const totalMb = (prog.total / (1024 * 1024)).toFixed(1);
          progressStatus.textContent = 'Downloading ' + transMb + ' / ' + totalMb + ' MB';
        }
      });
    }

    btnClose.addEventListener('click', () => {
      if (window.updatePopup) window.updatePopup.dismissPopup();
    });

    btnLater.addEventListener('click', () => {
      if (window.updatePopup) window.updatePopup.dismissPopup();
    });

    btnUpdate.addEventListener('click', async () => {
      if (isDownloading) return;
      isDownloading = true;
      btnUpdate.disabled = true;
      btnUpdate.textContent = 'Starting...';
      progressSection.style.display = 'block';
      actionsSection.style.display = 'none';
      
      if (window.updatePopup) {
        await window.updatePopup.startUpdate();
      }
    });
  </script>
</body>
</html>
