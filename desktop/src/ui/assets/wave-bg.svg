<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 700" fill="none" preserveAspectRatio="none">
  <defs>
    <!-- Soft spine glow filter -->
    <filter id="spineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="spineGrad" x1="20%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.65"/>
      <stop offset="30%" stop-color="#F43F5E" stop-opacity="0.60"/>
      <stop offset="55%" stop-color="#FB923C" stop-opacity="0.65"/>
      <stop offset="80%" stop-color="#F59E0B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="silkAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#FDBA74" stop-opacity="0.50"/>
      <stop offset="80%" stop-color="#F59E0B" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.18"/>
    </linearGradient>

    <linearGradient id="silkRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FB7185" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

